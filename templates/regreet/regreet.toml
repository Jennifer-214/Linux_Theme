[background]
path = "/usr/share/wallpapers/{{WALLPAPER}}"
fit = "Cover"

[env]
XDG_SESSION_TYPE = "wayland"
XDG_CURRENT_DESKTOP = "Hyprland"
XDG_SESSION_DESKTOP = "Hyprland"
QT_QPA_PLATFORM = "wayland"
MOZ_ENABLE_WAYLAND = "1"

[GTK]
application_prefer_dark_theme = {{REGREET_PREFER_DARK}}
cursor_theme_name = "{{CURSOR_THEME}}"
cursor_theme_size = 30
font_name = "MonaspiceKr Nerd Font 11"
icon_theme_name = "{{MAKO_ICON_THEME}}"
theme_name = "Adwaita"

[commands]
reboot = ["systemctl", "reboot"]
poweroff = ["systemctl", "poweroff"]

[appearance]
greeting_msg = "{{REGREET_GREETING}}"

[widget.clock]
format = "{{REGREET_CLOCK_FORMAT}}"
resolution = "1000ms"
label_width = 220
