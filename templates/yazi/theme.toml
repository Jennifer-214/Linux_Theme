# Fox ML Theme for Yazi
# Matches waybar, hyprland, tmux, kitty, and spicetify

# Color Palette:
# bg:       #{{BG}}
# fg:       #{{FG}}
# slate:    #{{SURFACE}}
# peach:    #{{PRIMARY}}
# lavender: #{{ACCENT}}
# pink:     #{{SECONDARY}}

[mgr]
cwd = { fg = "#{{PRIMARY}}", bold = {{SHOW_WELCOME}} }
syntect_theme = "~/.config/bat/themes/Fox ML.tmTheme"
find_keyword = { fg = "#{{YELLOW}}", underline = {{SHOW_WELCOME}} }
find_position = { fg = "#{{ACCENT}}" }
marker_copied = { fg = "#{{YAZI_MARK_COPIED}}", bg = "#{{YAZI_MARK_COPIED}}" }
marker_cut = { fg = "#{{RED}}", bg = "#{{RED}}" }
marker_marked = { fg = "#{{YAZI_MARK_MARKED}}", bg = "#{{YAZI_MARK_MARKED}}" }
marker_selected = { fg = "#{{YAZI_MARK_SELECTED}}", bg = "#{{YAZI_MARK_SELECTED}}" }
count_copied = { fg = "#{{YAZI_COPIED_FG}}", bg = "#{{YAZI_COPIED_BG}}", bold = {{SHOW_WELCOME}} }
count_cut = { fg = "#{{BG}}", bg = "#{{RED}}" }
count_selected = { fg = "#{{YAZI_SELECTED_FG}}", bg = "#{{YAZI_SELECTED_BG}}", bold = {{SHOW_WELCOME}} }
border_symbol = "│"
border_style = { fg = "#{{TMUX_ACTIVE_BG}}" }

[indicator]
parent = { fg = "#{{FG}}", bg = "#{{BG_HIGHLIGHT}}" }
current = { fg = "#{{YAZI_HOVER_FG}}", bg = "#{{YAZI_HOVER_BG}}", bold = {{SHOW_WELCOME}} }
preview = { underline = {{SHOW_WELCOME}} }

[tabs]
active = { fg = "#{{YAZI_TAB_ACTIVE_FG}}", bg = "#{{YAZI_TAB_ACTIVE_BG}}", bold = {{SHOW_WELCOME}} }
inactive = { fg = "#{{FG_DIM}}", bg = "#{{SURFACE}}" }

[mode]
normal_main = { fg = "#{{YAZI_MODE_FG}}", bg = "#{{YAZI_MODE_NORMAL_BG}}", bold = {{SHOW_WELCOME}} }
normal_alt = { fg = "#{{YAZI_MODE_ALT_FG}}", bg = "#{{YAZI_MODE_NORMAL_ALT_BG}}" }
select_main = { fg = "#{{YAZI_MODE_FG}}", bg = "#{{YAZI_MODE_SELECT_BG}}", bold = {{SHOW_WELCOME}} }
select_alt = { fg = "#{{YAZI_MODE_ALT_FG}}", bg = "#{{YAZI_MODE_SELECT_ALT_BG}}" }
unset_main = { fg = "#{{YAZI_MODE_FG}}", bg = "#{{YAZI_MODE_UNSET_BG}}", bold = {{SHOW_WELCOME}} }
unset_alt = { fg = "#{{YAZI_MODE_ALT_FG}}", bg = "#{{YAZI_MODE_UNSET_ALT_BG}}" }

[status]
overall  = { fg = "#{{PRIMARY}}" }
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress
progress_label  = { fg = "#{{FG_PASTEL}}", bold = {{SHOW_WELCOME}} }
progress_normal = { fg = "#{{PRIMARY}}", bg = "#{{SURFACE}}" }
progress_error  = { fg = "#{{RED}}", bg = "#{{SURFACE}}" }

# Permissions
perm_type = { fg = "#{{PRIMARY}}" }
perm_read = { fg = "#{{ACCENT}}" }
perm_write = { fg = "#{{SECONDARY}}" }
perm_exec = { fg = "#{{GREEN}}" }
perm_sep  = { fg = "#{{FG_DIM}}" }

[input]
border   = { fg = "#{{PRIMARY}}" }
title    = {}
value    = {}
selected = { fg = "#{{YAZI_SELECTED_FG}}", bg = "#{{YAZI_SELECTED_BG}}" }

[pick]
border   = { fg = "#{{PRIMARY}}" }
active   = { fg = "#{{YAZI_SELECTED_FG}}", bg = "#{{YAZI_SELECTED_BG}}", bold = {{SHOW_WELCOME}} }
inactive = {}

[confirm]
border     = { fg = "#{{PRIMARY}}" }
title      = { fg = "#{{PRIMARY}}", bold = {{SHOW_WELCOME}} }
body       = {}
list       = {}
btn_yes    = { bg = "#{{YAZI_SELECTED_BG}}", fg = "#{{YAZI_SELECTED_FG}}" }
btn_no     = { bg = "#{{SURFACE}}", fg = "#{{FG}}" }
btn_labels = [ "  Yes  ", "  No  " ]

[spot]
border = { fg = "#{{PRIMARY}}" }
title  = { fg = "#{{PRIMARY}}", bold = {{SHOW_WELCOME}} }

[cmp]
border   = { fg = "#{{PRIMARY}}" }
active   = { fg = "#{{YAZI_SELECTED_FG}}", bg = "#{{YAZI_SELECTED_BG}}", bold = {{SHOW_WELCOME}} }
inactive = {}
icon_file    = ""
icon_folder  = ""
icon_command = ""

[tasks]
border  = { fg = "#{{PRIMARY}}" }
title   = {}
hovered = { fg = "#{{YAZI_SELECTED_FG}}", bg = "#{{YAZI_SELECTED_BG}}" }

[which]
cols            = 3
mask            = { bg = "#{{BG}}" }
cand            = { fg = "#{{ACCENT}}" }
rest            = { fg = "#{{FG_DIM}}" }
desc            = { fg = "#{{SECONDARY}}" }
separator       = "  "
separator_style = { fg = "#{{SURFACE}}" }

[help]
on      = { fg = "#{{ACCENT}}" }
run     = { fg = "#{{SECONDARY}}" }
desc    = {}
hovered = { fg = "#{{YAZI_SELECTED_FG}}", bg = "#{{YAZI_SELECTED_BG}}", bold = {{SHOW_WELCOME}} }
footer  = { fg = "#{{FG_DIM}}", bg = "#{{BG}}" }

[notify]
title_info  = { fg = "#{{GREEN}}" }
title_warn  = { fg = "#{{YELLOW}}" }
title_error = { fg = "#{{RED}}" }
icon_info  = ""
icon_warn  = ""
icon_error = ""

# foxml:icon-family-begin
[filetype]
rules = [
    # Symlinks
    { url = "*", is = "link", fg = "#{{CYAN}}", italic = {{SHOW_WELCOME}} },
    { url = "*", is = "orphan", fg = "#{{RED}}", italic = {{SHOW_WELCOME}} },

    # Executables
    { url = "*", is = "exec", fg = "#{{GREEN_BRIGHT}}" },

    # Images
    { mime = "image/*", fg = "#{{SECONDARY}}" },

    # Media
    { mime = "{audio,video}/*", fg = "#{{ACCENT}}" },

    # Archives
    { mime = "application/*zip*", fg = "#{{YELLOW}}" },
    { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#{{YELLOW}}" },

    # Documents
    { mime = "application/{pdf,doc,rtf}", fg = "#{{BLUE}}" },
    { mime = "application/vnd.*", fg = "#{{BLUE}}" },

    # Directories — bold peach like neo-tree
    { url = "*/", fg = "#{{PRIMARY}}", bold = {{SHOW_WELCOME}} },

    # Fallback — peach to match tmux/statusbar
    { url = "*", fg = "#{{PRIMARY}}" },
]

[icon]
prepend_conds = [
    { if = "dir", text = "", fg = "#{{PRIMARY}}" },
    { if = "!dir", text = "󰈔", fg = "#{{FG_DIM}}" },
]
# Default icons
globs = []
dirs = []
files = []
exts = []
conds = []
# foxml:icon-family-end
