# ~/.config/hypr/hyprlock.conf

# Fox ML Theme - Matching Hyprland/Waybar/Kitty

general {
    hide_cursor = true
    grace = 0
}

# Backgrounds — personalize.cpp rewrites the block below into one named
# block per monitor (path = matching pre-rendered variant) after
# configure_monitors runs. The placeholder paths are the FHD landscape
# / portrait variants that exist on all FoxML wallpaper drops; they're
# only used until personalize lands real per-monitor paths.
# foxml:hyprlock-backgrounds-begin
background {
    monitor = eDP-1
    path = /home/caramel/.wallpapers/foxml_sunrise_sunbeams_1920x1080.jpg
    blur_size = {{BLUR_SIZE}}
    blur_passes = {{BLUR_PASSES}}
    vibrancy = 0.20
    brightness = 0.45
    contrast = 1.10
}
background {
    monitor = HDMI-A-1
    path = /home/caramel/.wallpapers/foxml_sunrise_sunbeams_1080x1920.jpg
    blur_size = {{BLUR_SIZE}}
    blur_passes = {{BLUR_PASSES}}
    vibrancy = 0.20
    brightness = 0.45
    contrast = 1.10
}
# foxml:hyprlock-backgrounds-end

# Time display
label {
    monitor =
    text = $TIME
    color = rgba({{PRIMARY}}ff)
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba({{PRIMARY}}66)
    font_size = 96
    font_family = {{FONT_FAMILY}}
    position = 0, 200
    halign = center
    valign = center
}

# Date display
label {
    monitor =
    text = cmd[update:3600000] date +"%A, %B %d"
    color = rgba({{FG}}cc)
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba({{PRIMARY}}55)
    font_size = 24
    font_family = {{FONT_FAMILY}}
    position = 0, 100
    halign = center
    valign = center
}

# Greeting
label {
    monitor =
    text = ✦  $USER
    color = rgba({{BLUSH}}ff)
    font_size = 18
    font_family = {{FONT_FAMILY}}
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 60
    outline_thickness = 0
    rounding = {{ROUNDING}}
    inner_color = rgba({{BG}}cc)
    outer_color = rgba({{BLUSH}}ff)
    font_color = rgba({{FG}}ff)
    font_family = {{FONT_FAMILY}}
    placeholder_text = Enter Password
    placeholder_color = rgba({{SURFACE}}ff)
    dots_center = true
    dots_size = 0.33
    dots_spacing = 0.15
    fade_on_empty = false
    check_color = rgba({{GREEN}}ff)
    fail_color = rgba({{RED}}ff)
    fail_text = <i>$FAIL</i>
    fail_transition = 300
    capslock_color = rgba({{YELLOW}}ff)
    position = 0, -120
    halign = center
    valign = center
}

# Battery indicator (top-right). Reads any BAT* in /sys; degrades to empty
# string on desktops without a battery.
label {
    monitor =
    text = cmd[update:60000] sh -c 'for b in /sys/class/power_supply/BAT*/capacity; do [ -f "$b" ] && printf "BAT %s%%" "$(cat "$b")" && exit; done'
    color = rgba({{FG_DIM}}ff)
    font_size = 14
    font_family = {{FONT_FAMILY}}
    position = -30, -30
    halign = right
    valign = top
}

# Now-playing (bottom-center) — disabled. The cmd[] hook forks playerctl
# every 5s during the lock screen; if dbus is slow (common right after
# suspend/resume), the call blocks hyprlock's main loop and password
# submission appears to hang. Uncomment to restore at your own risk.
