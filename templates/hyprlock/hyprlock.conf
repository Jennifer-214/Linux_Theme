# ~/.config/hypr/hyprlock.conf

# Fox ML Theme — lock screen, styled to match the regreet login (regreet.css):
# peach wide-tracked brand, dim cream clock/date, ultra-subtle input. Flat —
# regreet strips text-shadow, so the clock carries no glow here either.

general {
    hide_cursor = true
}

# Backgrounds — personalize.cpp rewrites the block below into one named block per
# monitor, each on the wallpaper cut for that monitor's size, after the monitor
# layout is known; rotate_wallpaper.sh rewrites the path lines on rotation. Both stay
# strictly between the sentinels, so everything outside (brand / clock / input) is
# safe from them. personalize copies this block's settings (blur, brightness, ...)
# into every block it writes. Until it runs, the theme wallpaper covers every monitor.
# foxml:hyprlock-backgrounds-begin
background {
    monitor =
    path = ~/.wallpapers/{{WALLPAPER}}
    blur_size = {{BLUR_SIZE}}
    blur_passes = {{BLUR_PASSES}}
    vibrancy = {{HYPRLOCK_VIBRANCY}}
    brightness = {{HYPRLOCK_BRIGHTNESS}}
    contrast = {{HYPRLOCK_CONTRAST}}
}
# foxml:hyprlock-backgrounds-end

# Brand — a theme can park it (and the dot row) off-screen via HYPRLOCK_BRAND_Y / _DOTS_Y.
# regreet's #message_label: wide letter-spacing (faked with spaces;
# hyprlock has no letter-spacing property). Per-letter multicolor via pango
# <span> (## escapes the hyprlang comment char), cycling the warm banner
# palette. Generated by welcome_banner.cpp from WELCOME_TEXT — the line between
# the sentinels is re-spliced on every install; edit there, not here.
label {
    monitor =
    # foxml:hyprlock-brand-begin
    text = <span foreground='##{{CLAY}}'>F</span>   <span foreground='##{{WHEAT}}'>O</span>   <span foreground='##{{BLUSH}}'>X</span>    <span foreground='##{{CLAY}}'>O</span>   <span foreground='##{{WHEAT}}'>S</span>
    # foxml:hyprlock-brand-end
    color = rgba({{PRIMARY}}ff)
    font_size = 28
    font_family = {{FONT_FAMILY}}
    position = 0, {{HYPRLOCK_BRAND_Y}}
    halign = center
    valign = center
}

# Dot row — welcome-banner / greeter motif, kept dim + cream for regreet's palette
label {
    monitor =
    text = ●  ●  ●  ●  ●  ●  ●  ●
    color = rgba({{BLUSH}}cc)
    font_size = 10
    font_family = {{FONT_FAMILY}}
    position = 0, {{HYPRLOCK_DOTS_Y}}
    halign = center
    valign = center
}

# Clock — dim cream, secondary to the brand. Flat (no shadow) to match regreet.
label {
    monitor =
    text = {{HYPRLOCK_CLOCK_TEXT}}
    color = rgba({{HYPRLOCK_CLOCK_COLOR}})
    font_size = 52
    font_family = {{HYPRLOCK_CLOCK_FONT}}
    position = 0, 74
    halign = center
    valign = center
}

# HYPRLOCK_DATE_TEXT picks the format; Paper's helper adds handwriting and
# a blush underline without changing the clock or password-field spacing.
label {
    monitor =
    text = {{HYPRLOCK_DATE_TEXT}}
    color = rgba({{HYPRLOCK_DIM_COLOR}})
    font_size = 14
    font_family = {{FONT_FAMILY}}
    position = 0, 26
    halign = center
    valign = center
}

# Input — regreet entry: thin peach border (its focused tone — hyprlock is
# always focused when locked) over a dark warm fill, restrained dots
input-field {
    monitor =
    size = 280, 46
    outline_thickness = 1
    rounding = 4
    inner_color = rgba({{BG}}b3)
    outer_color = rgba({{HYPRLOCK_INPUT_BORDER}})
    font_color = rgba({{FG}}ff)
    font_family = {{FONT_FAMILY}}
    placeholder_text = <i>password, or a fingertip</i>
    dots_center = true
    # A theme picks the dot shape: Paper types plain dots (dots_text_format);
    # the rest keep hyprlock's round dots (dots_rounding = -1 is its default).
    {{HYPRLOCK_DOTS_STYLE}}
    dots_size = 0.24
    dots_spacing = 0.22
    fade_on_empty = false
    check_color = rgba({{GREEN}}ff)
    fail_color = rgba({{HYPRLOCK_FAIL}}ff)
    fail_text = {{HYPRLOCK_FAIL_TEXT}}
    capslock_color = rgba({{HYPRLOCK_CAPS}}ff)
    position = 0, -80
    halign = center
    valign = center
}

# Note — a handwritten sign-off under the password field; a theme without one
# parks it off-screen via HYPRLOCK_NOTE_Y
label {
    monitor =
    text = {{HYPRLOCK_NOTE}}
    color = rgba({{HYPRLOCK_DIM_COLOR}})
    font_size = 16
    font_family = {{HYPRLOCK_CLOCK_FONT}}
    position = 0, {{HYPRLOCK_NOTE_Y}}
    halign = center
    valign = center
}

# Above the password entry, well clear of the note and botanical illustration below it.
# All four widgets use the same center anchor, so rotation preserves their gaps.
label {
    monitor =
    text = cmd[update:500] sh "${XDG_CONFIG_HOME:-$HOME/.config}/hypr/scripts/capslock-label.sh"
    color = rgba({{FG}}ff)
    font_size = 11
    font_family = {{FONT_FAMILY}}
    position = 0, -36
    halign = center
    valign = center
}

# The botanical illustration under the note; a theme without one parks it off-screen via
# HYPRLOCK_CAT_Y. The drawer installer deploys the image.
image {
    monitor =
    path = ~/.config/quickshell/foxml/paper-sprig.png
    size = 110
    rounding = 0
    border_size = 0
    position = 0, {{HYPRLOCK_CAT_Y}}
    halign = center
    valign = center
}

# Battery (top-right) — cream .25, regreet label tone
label {
    monitor =
    text = cmd[update:60000] sh -c 'for b in /sys/class/power_supply/BAT*/capacity; do [ -f "$b" ] && printf "battery %s%%" "$(cat "$b")" && exit; done'
    color = rgba({{HYPRLOCK_DIM_COLOR}})
    font_size = 13
    font_family = {{FONT_FAMILY}}
    position = -30, -30
    halign = right
    valign = top
}

# Under the battery: Claude sessions still going while you are away ("2 still working ✎").
# Prints nothing when none are, or when the drawer is not installed.
label {
    monitor =
    text = cmd[update:5000] sh -c '[ -x "$HOME/.local/bin/fox-drawer" ] && "$HOME/.local/bin/fox-drawer" claude-lock-line 2>/dev/null'
    color = rgba({{HYPRLOCK_DIM_COLOR}})
    font_size = 12
    font_family = {{FONT_FAMILY}}
    position = -30, -56
    halign = right
    valign = top
}

# Native concurrent fingerprint (hyprlock >= 0.7): scans in parallel with the
# password field and shows status; never blocks password entry.
auth {
    fingerprint {
        enabled = true
        ready_message = a fingertip, or your password
        present_message = reading…
    }
}
