# ~/.config/hypr/hyprlock.conf

# Fox ML Theme — lock screen, styled to match the regreet login (regreet.css):
# peach wide-tracked brand, dim cream clock/date, ultra-subtle input. Flat —
# regreet strips text-shadow, so the clock carries no glow here either.

general {
    hide_cursor = true
    grace = 0
}

# Backgrounds — personalize.cpp / mappings.sh:_personalize_hyprlock rewrite the
# block below into one named block per monitor (path = matching pre-rendered
# variant) after configure_monitors runs; rotate_wallpaper.sh rewrites the
# path lines on rotation. BOTH are scoped strictly between the sentinels below,
# so everything outside this block (brand / clock / input) is safe from them.
# The placeholder paths are the FHD landscape / portrait variants that exist on
# all FoxML wallpaper drops; only used until personalize lands real paths.
# foxml:hyprlock-backgrounds-begin
background {
    monitor = eDP-1
    path = /home/caramel/.wallpapers/foxml_sunrise_sunbeams_1920x1080.jpg
    blur_size = {{BLUR_SIZE}}
    blur_passes = {{BLUR_PASSES}}
    vibrancy = 0.20
    brightness = 0.45
    contrast = 1.10
}
background {
    monitor = HDMI-A-1
    path = /home/caramel/.wallpapers/foxml_sunrise_sunbeams_1080x1920.jpg
    blur_size = {{BLUR_SIZE}}
    blur_passes = {{BLUR_PASSES}}
    vibrancy = 0.20
    brightness = 0.45
    contrast = 1.10
}
# foxml:hyprlock-backgrounds-end

# Brand — regreet's #message_label: peach .85, wide letter-spacing (faked with
# spaces, since hyprlock has no letter-spacing property)
label {
    monitor =
    text = F   O   X    O   S
    color = rgba({{PRIMARY}}ff)
    font_size = 28
    font_family = {{FONT_FAMILY}}
    position = 0, 200
    halign = center
    valign = center
}

# Dot row — welcome-banner / greeter motif, kept dim + cream for regreet's palette
label {
    monitor =
    text = ●  ●  ●  ●  ●  ●  ●  ●
    color = rgba({{BLUSH}}cc)
    font_size = 10
    font_family = {{FONT_FAMILY}}
    position = 0, 164
    halign = center
    valign = center
}

# Clock — dim cream, secondary to the brand. Flat (no shadow) to match regreet.
label {
    monitor =
    text = $TIME
    color = rgba({{FG}}66)
    font_size = 52
    font_family = {{FONT_FAMILY}}
    position = 0, 74
    halign = center
    valign = center
}

# Date — cream .25, regreet's secondary-label tone, dotted separator
label {
    monitor =
    text = cmd[update:3600000] date +"%A · %B %-d"
    color = rgba({{FG}}42)
    font_size = 14
    font_family = {{FONT_FAMILY}}
    position = 0, 26
    halign = center
    valign = center
}

# Input — regreet entry: thin peach border (its focused tone — hyprlock is
# always focused when locked) over a dark warm fill, restrained dots
input-field {
    monitor =
    size = 280, 46
    outline_thickness = 1
    rounding = 4
    inner_color = rgba({{BG}}b3)
    outer_color = rgba({{PRIMARY}}59)
    font_color = rgba({{FG}}ff)
    font_family = {{FONT_FAMILY}}
    placeholder_text = <i>password</i>
    placeholder_color = rgba({{FG}}1f)
    dots_center = true
    dots_size = 0.24
    dots_spacing = 0.22
    fade_on_empty = false
    check_color = rgba({{GREEN}}ff)
    fail_color = rgba({{RED}}ff)
    fail_text = <i>$FAIL</i>
    fail_transition = 300
    capslock_color = rgba({{YELLOW}}ff)
    position = 0, -80
    halign = center
    valign = center
}

# Battery (top-right) — cream .25, regreet label tone
label {
    monitor =
    text = cmd[update:60000] sh -c 'for b in /sys/class/power_supply/BAT*/capacity; do [ -f "$b" ] && printf "BAT %s%%" "$(cat "$b")" && exit; done'
    color = rgba({{FG}}42)
    font_size = 13
    font_family = {{FONT_FAMILY}}
    position = -30, -30
    halign = right
    valign = top
}
