# ╭──────────────────────────────────────────────────────────────────╮
# │                     Fox ML Theme                                 │
# ╰──────────────────────────────────────────────────────────────────╯
#
#   ┌─────────────────────────────────────┐
#   │           Color Palette             │
#   ├──────────────┬──────────────────────┤
#   │  bg          │  #{{BG}}             │
#   │  fg          │  #{{FG}}             │
#   │  slate       │  #{{SURFACE}}             │
#   │  peach       │  #{{PRIMARY}}             │
#   │  sage        │  #{{ACCENT}}             │
#   └──────────────┴──────────────────────┘

# ─────────────────────────────────────────
# General
# ─────────────────────────────────────────
general {
    gaps_in = {{GAP_IN}}
    gaps_out = {{GAP_OUT}}
    border_size = {{HYPR_BORDER_SIZE}}
    layout = dwindle

    col.active_border = rgba({{BLUSH}}ff) rgba({{PRIMARY}}ff) 45deg   # blush → peach (only visible if border_size > 0)
    col.inactive_border = rgba({{HYPR_BORDER_INACTIVE}})            # slate (dimmed)
}

# ─────────────────────────────────────────
# Groups (Tabs)
# ─────────────────────────────────────────
group {
    insert_after_current = {{SHOW_WELCOME}}
    col.border_active = rgba({{BLUSH}}ff) rgba({{PRIMARY}}ff) 45deg
    col.border_inactive = rgba({{SURFACE}}66)
    col.border_locked_active = rgba({{RED}}ff)
    col.border_locked_inactive = rgba({{SURFACE}}66)

    groupbar {
        enabled = {{SHOW_WELCOME}}
        font_family = {{FONT_FAMILY}}
        font_size = 10
        gradients = {{SHOW_WELCOME}}
        height = 16
        priority = 3
        render_titles = {{SHOW_WELCOME}}
        scrolling = {{SHOW_WELCOME}}
        text_color = rgba({{FG}}ff)
        col.active = rgba({{PRIMARY}}bb)
        col.inactive = rgba({{SURFACE}}88)
        col.locked_active = rgba({{RED}}bb)
        col.locked_inactive = rgba({{SURFACE}}88)
    }
}

# ─────────────────────────────────────────
# Decoration
# ─────────────────────────────────────────
decoration {
    rounding = {{ROUNDING}}

    active_opacity = 1.0
    inactive_opacity = {{HYPR_INACTIVE_OPACITY}}

    blur {
        enabled = {{SHOW_WELCOME}}
        size = {{BLUR_SIZE}}
        passes = {{BLUR_PASSES}}
        noise = 0.02
        contrast = 1.0
        brightness = 0.97
        new_optimizations = {{SHOW_WELCOME}}
        xray = false
    }

    shadow {
        enabled = {{SHOW_WELCOME}}
        range = {{SHADOW_RANGE}}
        render_power = 3
        offset = {{HYPR_SHADOW_OFFSET_X}} {{HYPR_SHADOW_OFFSET_Y}}
        color = rgba({{HYPR_SHADOW_RGB_R}},{{HYPR_SHADOW_RGB_G}},{{HYPR_SHADOW_RGB_B}},{{SHADOW_ALPHA}})
        color_inactive = rgba({{HYPR_SHADOW_RGB_R}},{{HYPR_SHADOW_RGB_G}},{{HYPR_SHADOW_RGB_B}},{{HYPR_SHADOW_ALPHA_INACTIVE}})
    }

    dim_inactive = {{SHOW_WELCOME}}
    dim_strength = {{HYPR_DIM_STRENGTH}}
}

# ─────────────────────────────────────────
# Animations
# ─────────────────────────────────────────
animations {
    enabled = yes

    bezier = foxEase, 0.16, 1.0, 0.3, 1.0
    bezier = foxSnap, 0.05, 0.9, 0.1, 1.0
    bezier = foxSettle, 0.22, 1.0, 0.36, 1.05
    bezier = foxBounce, {{KITTY_BG_OPACITY}}8, -0.3, 0.265, 1.35
    bezier = foxSlow, 0.0, {{KITTY_BG_OPACITY}}, 0.4, 1.0

    animation = windows, 1, 5, foxSnap, popin 92%
    animation = windowsIn, 1, 5, {{HYPR_WIN_CURVE}}, popin 92%
    animation = windowsOut, 1, 4, foxEase, popin 80%
    animation = windowsMove, 1, 4, foxSnap
    animation = border, 1, 12, foxSlow
    # off: the angle animation kept Hyprland repainting every frame (~11% of a core, measured
    # 2026-10-15), and drew nothing at border_size 0. Borders that are on stay a static gradient.
    animation = borderangle, 0
    animation = fade, 1, 5, foxEase
    animation = fadeIn, 1, 4, foxEase
    animation = fadeOut, 1, 4, foxEase
    animation = workspaces, 1, 5, foxSnap, {{HYPR_WS_ANIM}}
    animation = layersIn, 1, 4, foxSnap, slide top
    animation = layersOut, 1, 4, foxEase, slide top
}

# ─────────────────────────────────────────
# Misc
# ─────────────────────────────────────────
misc {
    disable_hyprland_logo = {{SHOW_WELCOME}}
}

# The shared bar surface stays still; its drawers animate inside Quickshell.
layerrule = no_anim on, match:namespace ^(foxml-bar)$

# Cursor theme follows the palette (environment.conf sets the search path + size)
cursor {
    enable_hyprcursor = {{HYPR_CURSOR_ENABLED}}
}
env = XCURSOR_THEME, {{CURSOR_THEME}}
env = HYPRCURSOR_THEME, {{CURSOR_THEME}}
