# ================= Base =================
set -sg escape-time 0
set -g repeat-time 300

set -g history-limit 200000

# Update environment variables when attaching (fixes Wayland in new sessions)
set -g update-environment "WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE DISPLAY SWAYSOCK HYPRLAND_INSTANCE_SIGNATURE"

set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:Tc"
set -ga terminal-features ",*:24-bit:RGB"

# Pass kitty graphics protocol through tmux (image previews in nvim/yazi/etc.)
set -g allow-passthrough on

# When the last window in a session closes, switch to the previous session
# instead of detaching the client. Pairs with `prefix + m` popped sessions —
# exiting the popped pane drops you back where you came from.
set -g detach-on-destroy previous

# Resize windows to the smallest client viewing them, not the largest. Avoids
# layout thrash when two clients on different sessions share a window (which
# happens with the kitty-pop binding below).
set -g aggressive-resize on

# Propagate session/window into the outer terminal title so kitty's window
# list shows what each tmux is doing.
set -g set-titles on
set -g set-titles-string "tmux: #S → #W"

# ================= Kill the real status bar =================
set -g status off

# ================= Pane footer as our "status bar" =================
# Pane footer as status
set -g pane-border-status bottom
set -g pane-border-style "fg=#{{BG}},bg=default"
set -g pane-active-border-style "fg=#{{BG}},bg=default"

# ================= Pane Visibility - Active pane emphasis =================
# Active pane solid plum, inactive pane transparent (inherits kitty opacity)
set -g window-style 'fg=#{{TMUX_INACTIVE_FG}},bg=default'
set -g window-active-style 'fg=#{{FG_PASTEL}},bg=default'

# Longer display time for pane numbers (prefix + q)
set -g display-panes-time 3000
set -g display-panes-active-colour colour{{ANSI_ACCENT2}}
set -g display-panes-colour colour{{ANSI_MUTED}}

# Pretty clock mode (Ctrl+a t)
set -g clock-mode-colour colour{{ANSI_ACCENT2}}
set -g clock-mode-style 24

# Message styling
set -g message-style 'fg=#{{WHITE}},bg=#{{PRIMARY}},bold'
set -g message-command-style 'fg=#{{WHITE}},bg=#{{ACCENT}}'

# Copy mode styling
set -g mode-style 'fg=#{{BG}},bg=#{{PRIMARY}}'

# ================= Popup (prefix + w session switcher) =================
# Floating frame matches the pane borders; bg=default inherits kitty opacity.
set -g popup-border-lines rounded
set -g popup-border-style 'fg=#{{PRIMARY}}'
set -g popup-style 'bg=default'

# Popups don't source .zshrc, so they never see $FZF_DEFAULT_OPTS. Seed the
# themed fzf palette into the tmux global env instead — display-popup inherits
# it, so tmux-sessionizer's fzf comes up in-theme. Re-rendered on theme swap.
# FZF carries the whole-popup --color set; C1/C2 colour the ◆/◇ row markers.
# bg:-1 / preview-bg:-1 = terminal default → inherits kitty opacity (transparent,
# like the surrounding panes and rofi). bg+ stays a solid tint = selection bar.
set-environment -g FOX_SESH_FZF "--color=bg:-1,preview-bg:-1,gutter:-1,bg+:#{{BG_HIGHLIGHT}},fg:#{{FG}},fg+:#{{WHITE}},hl:#{{FZF_ACCENT1}},hl+:#{{PRIMARY}},info:#{{TMUX_INACTIVE_FG}},prompt:#{{PRIMARY}},pointer:#{{PRIMARY}},marker:#{{PRIMARY}},header:#{{TMUX_INACTIVE_FG}},border:#{{PRIMARY}},label:#{{PRIMARY}},preview-border:#{{PRIMARY}},preview-label:#{{TMUX_INACTIVE_FG}},scrollbar:#{{PRIMARY}},separator:#{{PRIMARY}}"
set-environment -g FOX_SESH_C1 "{{PRIMARY}}"
set-environment -g FOX_SESH_C2 "{{TMUX_INACTIVE_FG}}"
set-environment -g FOX_SESH_C3 "{{FZF_ACCENT1}}"
# Prompt-gradient ANSI indices (match caramel.zsh-theme) for the preview header.
set-environment -g FOX_SESH_A1 "{{ANSI_ACCENT1}}"
set-environment -g FOX_SESH_A2 "{{ANSI_ACCENT2}}"
set-environment -g FOX_SESH_A3 "{{ANSI_ACCENT3}}"

# Pane border format — active pane gets peach text, inactive stays muted.
# tmux-pane-info is called once per pane (was twice — duplicated inside the
# active/inactive conditional), halving the fork rate on dense layouts.
set -g pane-border-format '#{?pane_active,#[fg=#{{PRIMARY}}] ◆ ,#[fg=colour{{ANSI_MUTED}}] ◇ }#S:#I • #(~/.local/bin/tmux-pane-info "#{pane_current_path}" "#{pane_current_command}")#{?pane_active, #[default], }'

# ================= Keys / panes =================
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g focus-events on

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind Tab last-window

# prefix + w — fuzzy session switcher / project launcher (replaces choose-tree).
# Live sessions + ~/code & ~/school project roots; enter switches/creates,
# ^r renames, ^x kills. prefix + s still opens the native session tree.
bind w display-popup -E -w 80% -h 70% "~/.local/bin/tmux-sessionizer"

# prefix + G — lazygit on the current pane's repo, in a themed float. Your
# ~/.config/lazygit is already themed, so the popup matches inside and out.
bind G display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit

# prefix + a — ask your local model (fox-ai-oracle) without leaving the terminal.
bind a display-popup -E -w 75% -h 70% "~/.local/bin/tmux-ai-ask"
unbind '"'
unbind %

# Mirror keystrokes to all panes in the current window. Toggle on for
# multi-host SSH or "do this everywhere" moments; toggle off when done.
bind e setw synchronize-panes

# Prefix + m = move current pane to a brand-new session and switch this client to it.
# break-pane -P -F captures the new window id so we can target it precisely
# instead of guessing by index. -k on move-window kills the placeholder window
# new-session creates. -x/-y match the current client size — without them the
# placeholder is 80x24 and the popped TUI flashes a SIGWINCH redraw on attach.
# Session is named after the pane's directory (Linux_Theme, not pop-nvim-31337);
# a numeric suffix is appended only if that name is already taken.
bind m run-shell ' \
    dir=$(tmux display-message -p "#{pane_current_path}"); \
    w=$(tmux display-message -p "#{client_width}"); \
    h=$(tmux display-message -p "#{client_height}"); \
    base=$(basename "$dir" | tr " .:" "___"); sess="$base"; n=1; \
    while tmux has-session -t "=$sess" 2>/dev/null; do n=$((n+1)); sess="${base}-${n}"; done; \
    win=$(tmux break-pane -d -P -F "#{window_id}"); \
    tmux new-session -d -s "$sess" -x "$w" -y "$h"; \
    tmux move-window -s "$win" -t "${sess}:1" -k; \
    tmux switch-client -t "$sess"; \
    tmux display-message -d 2000 "Popped to session: $sess" \
'

# Prefix + M = pop current pane into its OWN kitty window (drag to portrait monitor).
# env -u TMUX unsets the inherited TMUX env var so the new kitty can actually
# attach to the popped session — without it tmux refuses to nest, attach falls
# back to the original session, and both kitty windows end up mirroring.
# Same -x/-y and directory-basename naming as `bind m` above.
bind M run-shell ' \
    dir=$(tmux display-message -p "#{pane_current_path}"); \
    w=$(tmux display-message -p "#{client_width}"); \
    h=$(tmux display-message -p "#{client_height}"); \
    base=$(basename "$dir" | tr " .:" "___"); sess="$base"; n=1; \
    while tmux has-session -t "=$sess" 2>/dev/null; do n=$((n+1)); sess="${base}-${n}"; done; \
    win=$(tmux break-pane -d -P -F "#{window_id}"); \
    tmux new-session -d -s "$sess" -x "$w" -y "$h"; \
    tmux move-window -s "$win" -t "${sess}:1" -k; \
    (kitty --detach -- env -u TMUX tmux attach -t "$sess" >/dev/null 2>&1 &); \
    tmux display-message -d 2000 "Popped to kitty: $sess" \
'

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

# Copy mode with system clipboard
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
# Mouse drag-release pipes selection to wl-copy without exiting copy mode.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear "wl-copy"
# Block selection toggle and whole-line yank.
bind -T copy-mode-vi r send -X rectangle-toggle
bind -T copy-mode-vi Y send -X copy-line

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config Reloaded"

#key bind for nested sessions
bind -n C-S-a send-prefix
