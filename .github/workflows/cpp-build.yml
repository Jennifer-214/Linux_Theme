name: cpp-build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pins:
    # Reads .github/toolchain.json, the one place the toolchains are pinned.
    runs-on: ubuntu-latest
    outputs:
      ubuntu: ${{ steps.read.outputs.ubuntu }}
      archImage: ${{ steps.read.outputs.archImage }}
      archSnapshot: ${{ steps.read.outputs.archSnapshot }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/toolchain.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - id: read
        run: python3 -c "import json; [print(f'{k}={v}') for k, v in json.load(open('.github/toolchain.json')).items() if k != '_']" >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: pins
    # Ubuntu provides the C++ toolchain and native Mako rendering libraries.
    # Distro-specific
    # behaviour (pacman, systemd, hyprland) is exercised in a separate
    # integration step on a real Arch host, not here.
    # One release of the runner image, so its compiler only changes when .github/toolchain.json does.
    runs-on: ${{ needs.pins.outputs.ubuntu }}

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ccache g++ make libcurl4-openssl-dev python3 pkg-config \
            libcairo2-dev libpango1.0-dev libglib2.0-dev libgdk-pixbuf-2.0-dev \
            libsystemd-dev libwayland-dev wayland-protocols

      - name: Name the compiler cache after this CPU model
        # -march=native objects are only safe to reuse on the same kind of CPU.
        # The runner context exists only inside steps, so the cache folder is named here too.
        run: |
          echo "CPU_KEY=$(grep -m1 'model name' /proc/cpuinfo | sha1sum | cut -c1-12)" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-cpp-build-${{ runner.os }}-${{ env.CPU_KEY }}-${{ github.sha }}
          restore-keys: ccache-cpp-build-${{ runner.os }}-${{ env.CPU_KEY }}-
      - name: Compile through the cache
        run: echo /usr/lib/ccache >> "$GITHUB_PATH"

      - name: List discovered tools
        run: make list

      - name: Build everything
        run: make -j"$(nproc)"

      - name: Run unit tests
        run: make test

      - name: Compiler cache use
        if: always()
        run: ccache --show-stats || true

      - name: Smoke-check desk-install --help
        run: ./src/desk-install/desk-install --help

      - name: Render parity check (desk-render-fast vs render.sh)
        run: |
          set -e
          rm -rf /tmp/native /tmp/legacy
          ./src/desk-render/desk-render-fast \
            themes/Classic/palette.sh templates /tmp/native > /dev/null
          ./render.sh \
            themes/Classic/palette.sh templates /tmp/legacy > /dev/null
          if diff -rq /tmp/native /tmp/legacy > /tmp/diff.log; then
            echo "Native renderer matches legacy render.sh byte-for-byte."
          else
            echo "Render parity broken:"
            cat /tmp/diff.log
            exit 1
          fi
