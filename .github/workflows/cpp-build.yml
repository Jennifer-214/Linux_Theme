name: cpp-build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # Ubuntu provides the C++ toolchain and native Mako rendering libraries.
    # Distro-specific
    # behaviour (pacman, systemd, hyprland) is exercised in a separate
    # integration step on a real Arch host, not here.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            g++ make libcurl4-openssl-dev python3 pkg-config \
            libcairo2-dev libpango1.0-dev libglib2.0-dev libgdk-pixbuf-2.0-dev \
            libsystemd-dev libwayland-dev wayland-protocols

      - name: Fetch nlohmann/json header (desk-intel dep)
        run: |
          curl -fsSL \
            https://github.com/nlohmann/json/releases/latest/download/json.hpp \
            -o src/desk-intel/json.hpp

      - name: List discovered tools
        run: make list

      - name: Build everything
        run: make

      - name: Run unit tests
        run: make test

      - name: Smoke-check desk-install --help
        run: ./src/desk-install/desk-install --help

      - name: Render parity check (desk-render-fast vs render.sh)
        run: |
          set -e
          rm -rf /tmp/native /tmp/legacy
          ./src/desk-render/desk-render-fast \
            themes/FoxML_Classic/palette.sh templates /tmp/native > /dev/null
          ./render.sh \
            themes/FoxML_Classic/palette.sh templates /tmp/legacy > /dev/null
          if diff -rq /tmp/native /tmp/legacy > /tmp/diff.log; then
            echo "Native renderer matches legacy render.sh byte-for-byte."
          else
            echo "Render parity broken:"
            cat /tmp/diff.log
            exit 1
          fi
