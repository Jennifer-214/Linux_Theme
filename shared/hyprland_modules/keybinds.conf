# ╭──────────────────────────────────────────────────────────────────╮
# │                         Keybinds                                 │
# ╰──────────────────────────────────────────────────────────────────╯

# ─────────────────────────────────────────
# App Variables
# ─────────────────────────────────────────
$terminal    = kitty tmux new-session
$browser     = env -u MOZ_ENABLE_WAYLAND -u LIBVA_DRIVER_NAME -u GBM_BACKEND -u WLR_NO_HARDWARE_CURSORS firefox
$fileManager = yazi
$menu        = ~/.local/bin/desktop-menu root
$coding      = ~/.local/bin/cursor
$chat        = discord

$mainMod = ALT

# ─────────────────────────────────────────
# Applications
# ─────────────────────────────────────────
# Terminal (kitty + tmux).
bind = $mainMod,       RETURN, exec, $terminal
# Firefox.
bind = $mainMod,       F,      exec, $browser
# Cursor (code editor).
bind = $mainMod SHIFT, C,      exec, $coding
# Drawers — apps, connections, sound, comfort and system.
bind = $mainMod SHIFT, D,      exec, $menu
# Find anything: open with the search field already focused.
bind = $mainMod,       SPACE,  exec, ~/.local/bin/desktop-menu search
# Calendar beneath the clock banner (toggle).
bind = $mainMod,       C,      exec, ~/.local/bin/desktop-menu calendar
# Steam.
bind = $mainMod SHIFT, M,      exec, steam steam://open/main
# Yazi file manager (toggle).
bind = $mainMod SHIFT, Y,      exec, ~/.config/launchers/toggle/toggle_yazi.sh
# btop system monitor (toggle).
bind = $mainMod SHIFT, T,      exec, ~/.config/launchers/toggle/toggle_btop.sh
# Network / Wi-Fi menu.
bind = $mainMod SHIFT, N,      exec, ~/.local/bin/desktop-menu wifi
# Bluetooth menu.
bind = $mainMod SHIFT, B,      exec, ~/.local/bin/desktop-menu bluetooth
# Audio output switcher.
bind = $mainMod SHIFT, A,      exec, ~/.local/bin/desktop-menu audio-outputs
# Color picker — copies the hex and shows it on a COPIED slip with a swatch.
bind = $mainMod SHIFT, P,      exec, ~/.config/hypr/scripts/color_picker.sh
# Discord.
bind = $mainMod SHIFT, I,      exec, $chat
# Screenshot (GUI editor).
bind = $mainMod SHIFT, O,      exec, ~/.config/hypr/scripts/screenshot.sh
# Quick screenshot — a region straight to the clipboard and ~/Pictures/Screenshots, no editor.
bind = ,               Print,  exec, ~/.config/hypr/scripts/screenshot.sh --quick
# Screenshot scrapbook (saved captures).
bind = $mainMod CTRL,  O,      exec, ~/.local/bin/desktop-menu screenshots
# Toggle the desktop bar.
bind = $mainMod,       B,      exec, desk-bar toggle
# Cycle wallpaper.
bind = $mainMod,       W,      exec, ~/.config/hypr/scripts/rotate_wallpaper.sh --cycle
# Clipboard history — text.
bind = $mainMod,       V,      exec, ~/.local/bin/desktop-menu clipboard-text
# Clipboard history — images.
bind = $mainMod SHIFT, V,      exec, ~/.local/bin/desktop-menu clipboard-images
# Lock the screen now.
bind = $mainMod CTRL,  L,      exec, ~/.config/hypr/scripts/lock.sh
# Lockdown — wipe clipboard, close Firefox session, stop editors and engines, lock.
bind = $mainMod CTRL SHIFT, K, exec, ~/.config/hypr/scripts/panic.sh
# Power menu.
bind = $mainMod SHIFT, X,      exec, ~/.local/bin/desktop-menu power
# Agents — each Claude session with its context meters and state, then pending notes; Enter switches tmux to that pane.
bind = $mainMod SHIFT, E,      exec, ~/.local/bin/desktop-menu agents
# Next waiting session — jumps tmux to the Claude session waiting on you, the one asking first; press again for the next.
bind = $mainMod CTRL, E,       exec, ~/.local/bin/desk-drawer claude-next
# Path of Building (Flatpak) — build planner; `pob 2` for PoE 2.
bind = $mainMod CTRL,  P,      exec, ~/.local/bin/pob

# ─────────────────────────────────────────
# Media Keys
# ─────────────────────────────────────────
bindel = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/osd.sh volume up
bindel = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/osd.sh volume down
bindl  = , XF86AudioMute,        exec, ~/.config/hypr/scripts/osd.sh volume mute
bindl  = , XF86MonBrightnessUp,   exec, ~/.config/hypr/scripts/osd.sh brightness up
bindl  = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/osd.sh brightness down
# Microphone mute, with a note saying which way it went.
bindl  = , XF86AudioMicMute,     exec, ~/.config/hypr/scripts/osd.sh mic mute
# Play / pause, with the little song slip.
bindl  = , XF86AudioPlay,        exec, ~/.config/hypr/scripts/media.sh play-pause
# Next track, with the little song slip.
bindl  = , XF86AudioNext,        exec, ~/.config/hypr/scripts/media.sh next
# Previous track, with the little song slip.
bindl  = , XF86AudioPrev,        exec, ~/.config/hypr/scripts/media.sh previous
bindl  = , XF86AudioStop,        exec, playerctl stop

# ─────────────────────────────────────────
# Window Management
# ─────────────────────────────────────────
# Toggle window group (tabbed stack). Moved off ALT+G — that's Ghost Mode.
bind = $mainMod,       T, togglegroup
bind = $mainMod,       bracketleft,  changegroupactive, b
bind = $mainMod,       bracketright, changegroupactive, f
bind = $mainMod,       P, pin
bind = $mainMod,       S, layoutmsg, togglesplit
bind = $mainMod SHIFT, Q, killactive
bind = $mainMod SHIFT, G, togglefloating
# gen-keybinds: allow-dup
bind = $mainMod SHIFT, G, centerwindow
# Reload Hyprland.
bind = $mainMod SHIFT, R, exec, hyprctl reload

# ─────────────────────────────────────────
# Window Focus
# ─────────────────────────────────────────
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r

# Move the focused window that way — tiled or floating — onto the next monitor at the edge.
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, j, movewindow, d
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, l, movewindow, r

bind = $mainMod SHIFT, Tab, cyclenext, prev
# Jump focus through only floating windows (skip tiled). Tiled-only inverse on $mod+CTRL+Tab.
# (We can't double up $mainMod since $mainMod is ALT — ALT+ALT+Tab wouldn't fire.)
bind = $mainMod, Tab, cyclenext, floating
bind = $mainMod CTRL, Tab, cyclenext, tiled
# Searchable keybind cheatsheet — fuzzy-find any binding by description
bind = $mainMod, slash, exec, ~/.local/bin/desktop-menu cheatsheet

# ─────────────────────────────────────────
# Workspaces
# ─────────────────────────────────────────
bind = $mainMod,       comma,  workspace, e-1
bind = $mainMod,       period, workspace, e+1

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# ─────────────────────────────────────────
# Mouse
# ─────────────────────────────────────────
bind  = $mainMod, mouse_down, workspace, e+1
bind  = $mainMod, mouse_up,   workspace, e-1
bindm = $mainMod, mouse:272,  movewindow
bindm = $mainMod, mouse:273,  resizewindow

# ─────────────────────────────────────────
# Sandbox launcher
# ─────────────────────────────────────────
# Drawer page for one-shot sandboxed apps. Firejail wraps the
# target with --private so its tmpfs $HOME evaporates on close. Quick
# way to visit a sketchy URL or run an untrusted script without it
# touching your real dotfiles.
bind = $mainMod SHIFT, S, exec, ~/.local/bin/desktop-menu sandbox

# ─────────────────────────────────────────
# Ghost Mode (boss key)
# ─────────────────────────────────────────
# Boss key — hide waybar, mute audio, opacify + blur everything. Same
# keybind toggles back to normal. State persists across keypresses via a
# runtime file.
bind = $mainMod, G, exec, ~/.config/hypr/scripts/ghost-mode.sh

# ─────────────────────────────────────────
# Window drawer
# ─────────────────────────────────────────
# Active windows with the same navigation as the other drawers.
bind = $mainMod, grave, exec, ~/.local/bin/desktop-menu windows

# The desk overview: every workspace as a photo print (hjkl/arrows + Enter, a click or a digit goes there; Esc closes).
bind = $mainMod, O, exec, quickshell -c desk ipc call overview toggle

# ─────────────────────────────────────────
# TTY switch (diagnostics)
# ─────────────────────────────────────────
# CTRL+ALT+F1..F6 switches to a kernel TTY while Hyprland is responsive.
# Won't escape a wedged hyprlock — hyprlock holds the seat grab so neither
# Hyprland nor the kernel sees these keys. For wedge recovery, enable
# kernel.sysrq=1 in /etc/sysctl.d and use Alt+SysRq+r followed by Ctrl+Alt+F2.
#
# chvt requires CAP_SYS_TTY_CONFIG. Either run with `sudo chvt` via a
# NOPASSWD sudoers rule for the wheel user, or set chvt setuid root.
bind = CTRL ALT, F1, exec, chvt 1
bind = CTRL ALT, F2, exec, chvt 2
bind = CTRL ALT, F3, exec, chvt 3
bind = CTRL ALT, F4, exec, chvt 4
bind = CTRL ALT, F5, exec, chvt 5
bind = CTRL ALT, F6, exec, chvt 6

# ─────────────────────────────────────────
# Resize / move submap
# ─────────────────────────────────────────
# Resize / move mode. ALT+R enters: bare hjkl resize the focused window,
# SHIFT+hjkl nudge it (moveactive — floating windows only, by pixels; ALT+SHIFT+hjkl
# outside this mode moves any window a whole slot). binde
# repeats on hold so you can glide. Escape or Return exits.
bind = $mainMod, R, submap, resize

submap = resize
binde = ,      h, resizeactive, -40   0
binde = ,      j, resizeactive,   0  40
binde = ,      k, resizeactive,   0 -40
binde = ,      l, resizeactive,  40   0
binde = SHIFT, h, moveactive,   -40   0
binde = SHIFT, j, moveactive,     0  40
binde = SHIFT, k, moveactive,     0 -40
binde = SHIFT, l, moveactive,    40   0
bind  = ,      escape, submap, reset
bind  = ,      return, submap, reset
submap = reset
